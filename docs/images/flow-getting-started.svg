<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560">
<defs><marker id="ah-B45529" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#B45529"/></marker></defs>
<rect width="1280" height="560" rx="28" fill="#FEF9EF"/>
<text x="56" y="66" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="400" fill="#2A2B2F" text-anchor="start"><tspan x="56" dy="0">How a couple starts with Seiya</tspan></text>
<text x="56" y="98" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#6B6F6E" text-anchor="start"><tspan x="56" dy="0">Done once, together. After step 4 the rules are live and enforced on every shared expense.</tspan></text><rect x="40" y="132" width="180" height="200" rx="18" fill="#FFFFFF" stroke="#E7DCCB" stroke-width="1.5"/><circle cx="74" cy="170" r="18" fill="#2A2B2F"/><text x="74" y="176" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="74" dy="0">1</tspan></text><text x="58" y="224" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#2A2B2F" text-anchor="start"><tspan x="58" dy="0">Sign up</tspan></text><text x="58" y="254" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#6B6F6E" text-anchor="start"><tspan x="58" dy="0">Full name and</tspan><tspan x="58" dy="19.599999999999998">password. No</tspan><tspan x="58" dy="19.599999999999998">email needed.</tspan></text><path d="M223 232 L241 232" fill="none" stroke="#B45529" stroke-width="2" marker-end="url(#ah-B45529)"/><rect x="244" y="132" width="180" height="200" rx="18" fill="#FFFFFF" stroke="#E7DCCB" stroke-width="1.5"/><circle cx="278" cy="170" r="18" fill="#2A2B2F"/><text x="278" y="176" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="278" dy="0">2</tspan></text><text x="262" y="224" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#2A2B2F" text-anchor="start"><tspan x="262" dy="0">Create or join</tspan></text><text x="262" y="254" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#6B6F6E" text-anchor="start"><tspan x="262" dy="0">One partner creates</tspan><tspan x="262" dy="19.599999999999998">the shared space and</tspan><tspan x="262" dy="19.599999999999998">sends a private invite.</tspan></text><path d="M427 232 L445 232" fill="none" stroke="#B45529" stroke-width="2" marker-end="url(#ah-B45529)"/><rect x="448" y="132" width="180" height="200" rx="18" fill="#FFFFFF" stroke="#E7DCCB" stroke-width="1.5"/><circle cx="482" cy="170" r="18" fill="#2A2B2F"/><text x="482" y="176" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="482" dy="0">3</tspan></text><text x="466" y="224" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#2A2B2F" text-anchor="start"><tspan x="466" dy="0">Get to know you</tspan></text><text x="466" y="254" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#6B6F6E" text-anchor="start"><tspan x="466" dy="0">21 short questions</tspan><tspan x="466" dy="19.599999999999998">about each partner's</tspan><tspan x="466" dy="19.599999999999998">money habits.</tspan></text><path d="M631 232 L649 232" fill="none" stroke="#B45529" stroke-width="2" marker-end="url(#ah-B45529)"/><rect x="652" y="132" width="180" height="200" rx="18" fill="#FAEADE" stroke="#B45529" stroke-width="2"/><circle cx="686" cy="170" r="18" fill="#B45529"/><text x="686" y="176" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="686" dy="0">4</tspan></text><text x="670" y="224" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#2A2B2F" text-anchor="start"><tspan x="670" dy="0">Seiya's Promise</tspan></text><text x="670" y="254" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#6B6F6E" text-anchor="start"><tspan x="670" dy="0">AI drafts the rules.</tspan><tspan x="670" dy="19.599999999999998">Both partners sign</tspan><tspan x="670" dy="19.599999999999998">the same clauses.</tspan></text><path d="M835 232 L853 232" fill="none" stroke="#B45529" stroke-width="2" marker-end="url(#ah-B45529)"/><rect x="856" y="132" width="180" height="200" rx="18" fill="#FFFFFF" stroke="#E7DCCB" stroke-width="1.5"/><circle cx="890" cy="170" r="18" fill="#2A2B2F"/><text x="890" y="176" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="890" dy="0">5</tspan></text><text x="874" y="224" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#2A2B2F" text-anchor="start"><tspan x="874" dy="0">Wallets open</tspan></text><text x="874" y="254" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#6B6F6E" text-anchor="start"><tspan x="874" dy="0">Shared + personal</tspan><tspan x="874" dy="19.599999999999998">wallets. Add your</tspan><tspan x="874" dy="19.599999999999998">starting balance.</tspan></text><path d="M1039 232 L1057 232" fill="none" stroke="#B45529" stroke-width="2" marker-end="url(#ah-B45529)"/><rect x="1060" y="132" width="180" height="200" rx="18" fill="#FFFFFF" stroke="#E7DCCB" stroke-width="1.5"/><circle cx="1094" cy="170" r="18" fill="#2A2B2F"/><text x="1094" y="176" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="1094" dy="0">6</tspan></text><text x="1078" y="224" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#2A2B2F" text-anchor="start"><tspan x="1078" dy="0">Security PIN</tspan></text><text x="1078" y="254" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#6B6F6E" text-anchor="start"><tspan x="1078" dy="0">A 6-digit PIN to</tspan><tspan x="1078" dy="19.599999999999998">approve requests and</tspan><tspan x="1078" dy="19.599999999999998">sign rule changes.</tspan></text><rect x="40" y="368" width="1200" height="158" rx="22" fill="#FBF4E8" stroke="#E7DCCB" stroke-width="1.5" stroke-dasharray="6 6"/><text x="70" y="408" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="400" fill="#2A2B2F" text-anchor="start"><tspan x="70" dy="0">Then, every day</tspan></text><rect x="82" y="428" width="212" height="74" rx="14" fill="#FFFFFF" stroke="#E7DCCB" stroke-width="1.5"/><text x="98" y="458" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#B45529" text-anchor="start"><tspan x="98" dy="0">Home</tspan></text><text x="98" y="484" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#6B6F6E" text-anchor="start"><tspan x="98" dy="0">Balances, monthly overview</tspan></text><rect x="308" y="428" width="212" height="74" rx="14" fill="#FFFFFF" stroke="#E7DCCB" stroke-width="1.5"/><text x="324" y="458" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#B45529" text-anchor="start"><tspan x="324" dy="0">Ask Seiya</tspan></text><text x="324" y="484" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#6B6F6E" text-anchor="start"><tspan x="324" dy="0">Chat, receipts, statements</tspan></text><rect x="534" y="428" width="212" height="74" rx="14" fill="#FFFFFF" stroke="#E7DCCB" stroke-width="1.5"/><text x="550" y="458" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#B45529" text-anchor="start"><tspan x="550" dy="0">Approvals</tspan></text><text x="550" y="484" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#6B6F6E" text-anchor="start"><tspan x="550" dy="0">Requests waiting for you</tspan></text><rect x="760" y="428" width="212" height="74" rx="14" fill="#FFFFFF" stroke="#E7DCCB" stroke-width="1.5"/><text x="776" y="458" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#B45529" text-anchor="start"><tspan x="776" dy="0">Bills &amp; Plan</tspan></text><text x="776" y="484" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#6B6F6E" text-anchor="start"><tspan x="776" dy="0">Due dates, budgets, goals</tspan></text><rect x="986" y="428" width="212" height="74" rx="14" fill="#FFFFFF" stroke="#E7DCCB" stroke-width="1.5"/><text x="1002" y="458" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#B45529" text-anchor="start"><tspan x="1002" dy="0">Activity</tspan></text><text x="1002" y="484" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#6B6F6E" text-anchor="start"><tspan x="1002" dy="0">History, who owes whom</tspan></text>
