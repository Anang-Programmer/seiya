</g><text x="460" y="260" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="start"><tspan x="460" dy="0">Seiya Gateway</tspan></text><text x="460" y="286" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#D9D4CC" text-anchor="start"><tspan x="460" dy="0">Reads your active Promise</tspan></text><path d="M558 310 L558 362" fill="none" stroke="#6B6F6E" stroke-width="2" marker-end="url(#ah-6B6F6E)"/><rect x="388" y="366" width="340" height="104" rx="18" fill="#FFFFFF" stroke="#C98A4F" stroke-width="2" stroke-dasharray="7 5"/><text x="410" y="398" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#C98A4F" text-anchor="start"><tspan x="410" dy="0">CHECK 1 · COOLING-OFF</tspan></text><text x="410" y="424" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#2A2B2F" text-anchor="start"><tspan x="410" dy="0">Late night (22:00–08:00) or impulse</tspan><tspan x="410" dy="21">buy, and amount ≥ cooling-off limit?</tspan></text><path d="M728 418 L838 418" fill="none" stroke="#C98A4F" stroke-width="2" marker-end="url(#ah-C98A4F)"/><text x="783" y="408" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#C98A4F" text-anchor="middle"><tspan x="783" dy="0">Yes</tspan></text><rect x="842" y="352" width="386" height="132" rx="18" fill="#FFF3E2" stroke="#C98A4F" stroke-width="2"/><text x="866" y="386" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#8A5A2B" text-anchor="start"><tspan x="866" dy="0">Waiting List</tspan></text><text x="866" y="412" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#6B6F6E" text-anchor="start"><tspan x="866" dy="0">Held for the agreed cooling-off hours.</tspan></text><rect x="866" y="432" width="110" height="29" rx="14.5" fill="#fff"/><text x="921" y="449" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#8A5A2B" text-anchor="middle"><tspan x="921" dy="0">Continue</tspan></text><rect x="988" y="432" width="196" height="29" rx="14.5" fill="#fff"/><text x="1086" y="449" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#A34426" text-anchor="middle"><tspan x="1086" dy="0">Cancel: nothing spent</tspan></text><path d="M921 484 L921 512 L668 512 L668 538" fill="none" stroke="#C98A4F" stroke-width="2" marker-end="url(#ah-C98A4F)"/><text x="800" y="504" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#C98A4F" text-anchor="middle"><tspan x="800" dy="0">Continue: checked again</tspan></text><path d="M558 470 L558 538" fill="none" stroke="#6B6F6E" stroke-width="2" marker-end="url(#ah-6B6F6E)"/><text x="572" y="512" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#6B6F6E" text-anchor="start"><tspan x="572" dy="0">No</tspan></text><rect x="388" y="542" width="340" height="104" rx="18" fill="#FFFFFF" stroke="#B45529" stroke-width="2" stroke-dasharray="7 5"/><text x="410" y="574" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#B45529" text-anchor="start"><tspan x="410" dy="0">CHECK 2 · PARTNER APPROVAL</tspan></text><text x="410" y="600" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#2A2B2F" text-anchor="start"><tspan x="410" dy="0">Shared wallet, and amount ≥ the</tspan><tspan x="410" dy="21">"discuss first" limit?</tspan></text><path d="M728 594 L838 594" fill="none" stroke="#B45529" stroke-width="2" marker-end="url(#ah-B45529)"/><text x="783" y="584" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#B45529" text-anchor="middle"><tspan x="783" dy="0">Yes</tspan></text><rect x="842" y="538" width="386" height="112" rx="18" fill="#FAEADE" stroke="#B45529" stroke-width="2"/><text x="866" y="572" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#B45529" text-anchor="start"><tspan x="866" dy="0">Approvals</tspan></text><text x="866" y="598" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#6B6F6E" text-anchor="start"><tspan x="866" dy="0">Your partner signs with their 6-digit PIN.</tspan><tspan x="866" dy="19.599999999999998">Nobody can approve their own request.</tspan></text><path d="M921 650 L921 740 L732 740" fill="none" stroke="#2D5232" stroke-width="2" marker-end="url(#ah-2D5232)"/><text x="934" y="700" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#2D5232" text-anchor="start"><tspan x="934" dy="0">Approved</tspan></text><path d="M1140 650 L1140 688" fill="none" stroke="#A34426" stroke-width="2" marker-end="url(#ah-A34426)"/><rect x="1010" y="692" width="218" height="28" rx="14" fill="#FBEAE4"/><text x="1119" y="708" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#A34426" text-anchor="middle"><tspan x="1119" dy="0">Declined or cancelled: nothing spent</tspan></text><path d="M558 646 L558 694" fill="none" stroke="#6B6F6E" stroke-width="2" marker-end="url(#ah-6B6F6E)"/><text x="572" y="676" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#6B6F6E" text-anchor="start"><tspan x="572" dy="0">No</tspan></text><rect x="388" y="698" width="340" height="92" rx="18" fill="#EDF3EC" stroke="#2D5232" stroke-width="2"/><text x="410" y="732" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#2D5232" text-anchor="start"><tspan x="410" dy="0">Recorded</tspan></text><text x="410" y="758" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#6B6F6E" text-anchor="start"><tspan x="410" dy="0">Wallet balance updated, the cost split</tspan><tspan x="410" dy="19.599999999999998">by your agreed %, logged in Activity.</tspan></text><rect x="56" y="826" width="376" height="92" rx="14" fill="#FBF4E8" stroke="#E7DCCB" stroke-width="1.5"/><text x="76" y="858" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#2A2B2F" text-anchor="start"><tspan x="76" dy="0">Personal wallet</tspan></text><text x="76" y="882" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6B6F6E" text-anchor="start"><tspan x="76" dy="0">No partner approval needed, and it stays</tspan><tspan x="76" dy="18.9">private from your partner.</tspan></text><rect x="452" y="826" width="376" height="92" rx="14" fill="#FBF4E8" stroke="#E7DCCB" stroke-width="1.5"/><text x="472" y="858" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#2A2B2F" text-anchor="start"><tspan x="472" dy="0">Not enough money?</tspan></text><text x="472" y="882" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6B6F6E" text-anchor="start"><tspan x="472" dy="0">Seiya stops the expense and asks you to Add</tspan><tspan x="472" dy="18.9">money first.</tspan></text><rect x="848" y="826" width="376" height="92" rx="14" fill="#FBF4E8" stroke="#E7DCCB" stroke-width="1.5"/><text x="868" y="858" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#2A2B2F" text-anchor="start"><tspan x="868" dy="0">The AI only proposes</tspan></text><text x="868" y="882" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6B6F6E" text-anchor="start"><tspan x="868" dy="0">Seiya's AI drafts and explains. It never</tspan><tspan x="868" dy="18.9">approves or moves money.</tspan></text>
</svg>
