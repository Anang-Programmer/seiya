<text x="56" y="66" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="400" fill="#2A2B2F" text-anchor="start"><tspan x="56" dy="0">What happens when you spend</tspan></text>
<text x="56" y="98" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#6B6F6E" text-anchor="start"><tspan x="56" dy="0">Every expense passes the Dual-Key Gateway, which checks the limits both partners signed in Seiya's Promise.</tspan></text><text x="56" y="146" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#6B6F6E" text-anchor="start"><tspan x="56" dy="0">LOG AN EXPENSE</tspan></text><rect x="56" y="160" width="250" height="46" rx="12" fill="#FFFFFF" stroke="#E7DCCB" stroke-width="1.5"/><text x="76" y="189" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#2A2B2F" text-anchor="start"><tspan x="76" dy="0">Propose Expense form</tspan></text><path d="M306 183 C346 183 346 266 384 266" fill="none" stroke="#6B6F6E" stroke-width="2" marker-end="url(#ah-6B6F6E)"/><rect x="56" y="218" width="250" height="46" rx="12" fill="#FFFFFF" stroke="#E7DCCB" stroke-width="1.5"/><text x="76" y="247" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#2A2B2F" text-anchor="start"><tspan x="76" dy="0">Ask Seiya chat</tspan></text><path d="M306 241 C346 241 346 266 384 266" fill="none" stroke="#6B6F6E" stroke-width="2" marker-end="url(#ah-6B6F6E)"/><rect x="56" y="276" width="250" height="46" rx="12" fill="#FFFFFF" stroke="#E7DCCB" stroke-width="1.5"/><text x="76" y="305" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#2A2B2F" text-anchor="start"><tspan x="76" dy="0">Receipt photo (OCR)</tspan></text><path d="M306 299 C346 299 346 266 384 266" fill="none" stroke="#6B6F6E" stroke-width="2" marker-end="url(#ah-6B6F6E)"/><rect x="56" y="334" width="250" height="46" rx="12" fill="#FFFFFF" stroke="#E7DCCB" stroke-width="1.5"/><text x="76" y="363" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#2A2B2F" text-anchor="start"><tspan x="76" dy="0">Bank statement import</tspan></text><path d="M306 357 C346 357 346 266 384 266" fill="none" stroke="#6B6F6E" stroke-width="2" marker-end="url(#ah-6B6F6E)"/><rect x="388" y="222" width="340" height="88" rx="16" fill="#2A2B2F" stroke="#2A2B2F" stroke-width="1.5"/><g transform="translate(408 246) scale(0.52)">
